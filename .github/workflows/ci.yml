name: ci

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.23.5
        env:
          POSTGRES_USER: bladedr
          POSTGRES_PASSWORD: bladedr
          # Named for testing on purpose: the store suite TRUNCATEs every table and
          # refuses a database whose name doesn't say it is disposable.
          POSTGRES_DB: bladedr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l internal cmd)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        env:
          BLADEDR_TEST_DATABASE_URL: postgres://bladedr:bladedr@localhost:5432/bladedr_test
        run: go test -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./internal/... ./...
      # The store contract suite skips its Postgres pass when the DSN is unset or the
      # service is down, and a skip is not a failure — so a broken service would
      # quietly reduce CI to testing the in-memory store only, which is exactly the
      # gap the suite exists to close. Assert the Postgres pass actually executed.
      - name: assert the store contract ran against Postgres
        env:
          BLADEDR_TEST_DATABASE_URL: postgres://bladedr:bladedr@localhost:5432/bladedr_test
        run: |
          go test -run 'TestStoreContract/postgres' -v ./internal/store/ | tee contract.log
          if grep -q -- '--- SKIP: TestStoreContract/postgres' contract.log; then
            echo "::error::the Postgres store contract was skipped; the production backend went untested"
            exit 1
          fi
      - name: upload coverage
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: build linux probes
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/bladedr-probe
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/bladedr-probe

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: pipx install semgrep && semgrep --config auto --error --quiet

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: end-to-end smoke
        run: ./scripts/smoke.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, semgrep, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true
      - name: build release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-server.linux-amd64   ./cmd/bladedr-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-server.linux-arm64   ./cmd/bladedr-server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-probe.linux-amd64    ./cmd/bladedr-probe
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-probe.linux-arm64    ./cmd/bladedr-probe
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-sensor.linux-amd64  ./cmd/bladedr-sensor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladedr-sensor.linux-arm64  ./cmd/bladedr-sensor
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladectl.linux-amd64        ./cmd/bladectl
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=${VERSION}" -o dist/bladectl.linux-arm64        ./cmd/bladectl
      - name: generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/bladedr.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: generate checksums
        working-directory: dist
        run: sha256sum bladedr-* bladectl.* bladedr.spdx.json > SHA256SUMS
      - name: create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          generate_release_notes: true
          files: dist/*

  # The image is the primary artifact: `docker run` with a database URL and a node key
  # should be a working control plane. Published only on a tag, and only after build,
  # semgrep and smoke have passed on that same commit.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, semgrep, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # arm64 is emulated here. It only builds Go binaries, so the cost is tolerable;
      # if it ever gets slow, split it onto a native arm64 runner instead of dropping
      # the platform — the probe ships for arm64, so the server should too.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: mar0ls/bladedr
          # latest tracks the newest stable tag; a prerelease (v1.0.0-rc1) publishes
          # its own tag but must not move latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

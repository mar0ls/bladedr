# Development only: the database alone, for running a locally built bladedr-server
# against Postgres (see README "Storage"). It has a fixed example password and no
# control plane. To deploy bladedr, use docs/compose.example.yml — see
# docs/deployment.md.
#
# ParadeDB = PostgreSQL + pg_search (BM25), the bladedr production backend.
# Bring up with: docker compose up -d
# The server applies its migrations on startup; there is no separate schema step.
services:
  db:
    image: paradedb/paradedb:0.23.5
    container_name: bladedr-db
    environment:
      POSTGRES_USER: bladedr
      POSTGRES_PASSWORD: bladedr
      POSTGRES_DB: bladedr
    ports:
      # Bound to the loopback interface on purpose. "5432:5432" publishes on every
      # interface, and Docker's rules sit in front of the host firewall, so the
      # default credentials above would be reachable from the network. This file is
      # for development; production deployment is docs/deployment.md.
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ images expect the mount at /var/lib/postgresql (data goes in a subdir).
      - bladedr_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bladedr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bladedr_pgdata:

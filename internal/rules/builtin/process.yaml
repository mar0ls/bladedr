id: deleted-running-binary
title: "Running process whose binary was deleted from disk"
category: process
severity: high
score: 70
mitre: ["T1055", "T1620"]
foreach: processes
when: 'item.exe_deleted == true && !item.exe.startsWith("/memfd:")'
evidence:
  pid: item.pid
  exe: item.exe
  comm: item.comm
dedup: ["item.pid", "item.exe"]
---
id: memfd-fileless-exec
title: "Fileless execution from an anonymous memfd"
category: process
severity: critical
score: 90
mitre: ["T1620", "T1059.004"]
foreach: processes
when: 'item.exe_memfd == true'
evidence:
  pid: item.pid
  comm: item.comm
  cmdline: item.cmdline
dedup: ["item.pid"]
---
id: exec-from-world-writable
title: "Binary executed from a world-writable path"
category: process
severity: medium
score: 50
mitre: ["T1059"]
foreach: processes
when: 'item.exe.startsWith("/tmp/") || item.exe.startsWith("/dev/shm/") || item.exe.startsWith("/var/tmp/")'
evidence:
  pid: item.pid
  exe: item.exe
dedup: ["item.exe"]
---
id: masquerade-kernel-thread
title: "Userland process masquerading as a kernel thread (kworker)"
category: process
severity: high
score: 75
mitre: ["T1036.004"]
foreach: processes
when: 'item.comm.contains("kworker") && item.exe != ""'
evidence:
  pid: item.pid
  comm: item.comm
  exe: item.exe
dedup: ["item.pid", "item.exe"]
---
id: hidden-process
title: "Process reachable via /proc/<pid> but hidden from the /proc listing (rootkit)"
category: process
severity: critical
score: 95
mitre: ["T1014"]
foreach: hidden_pids
when: 'item > 0'
evidence:
  pid: item
dedup: ["item"]
---
id: process-empty-environ
title: "Userland process with a wiped environment (anti-forensics, e.g. BPFDoor)"
category: process
severity: high
score: 70
mitre: ["T1070.004", "T1564"]
# A real (exe-backed) process that has cleared /proc/PID/environ is anomalous;
# BPFDoor and similar backdoors wipe it to hinder forensics. Kernel threads have
# an empty environ legitimately but no exe, so the exe!="" guard excludes them.
foreach: processes
when: 'item.exe != "" && item.environ_empty == true'
evidence:
  pid: item.pid
  comm: item.comm
  exe: item.exe
dedup: ["item.pid", "item.exe"]
---
id: process-reverse-shell-cmdline
title: "Running process command line is a reverse/bind shell"
category: execution
severity: critical
score: 95
mitre: ["T1059.004"]
# A live process whose cmdline redirects to /dev/tcp//dev/udp/<ip>, runs nc/ncat -e,
# or calls pty.spawn() is an interactive backdoor shell. The /dev/(tcp|udp)/[0-9]
# regex avoids matching search tools that merely carry the literal string.
foreach: processes
when: >
  item.cmdline.matches("/dev/(tcp|udp)/[0-9]") ||
  item.cmdline.contains("nc -e ") || item.cmdline.contains("ncat -e ") ||
  item.cmdline.contains("pty.spawn(")
evidence:
  pid: item.pid
  comm: item.comm
  cmdline: item.cmdline
dedup: ["item.pid", "item.cmdline"]
---
id: process-library-from-writable-path
title: "Process has a shared library loaded from a world-writable directory"
category: process
severity: medium
score: 60
mitre: ["T1574.006", "T1055"]
# Executable file mappings only (data mappings of /tmp files are ordinary), and never the
# process's own binary — that is exec-from-world-writable. Typical of an injected or
# preloaded implant library; also of AppImage and some installers that unpack to /tmp, so
# the model weighs it rather than the rule deciding.
foreach: processes
when: 'item.mapped_libs_writable != null && item.mapped_libs_writable.size() > 0'
evidence:
  pid: item.pid
  comm: item.comm
  exe: item.exe
  libs: item.mapped_libs_writable
dedup: ["item.exe"]
---
id: process-library-deleted
title: "Process runs a shared library that was deleted from disk after loading"
category: process
severity: medium
score: 60
mitre: ["T1574.006", "T1070.004"]
# The library is still mapped but its file is gone: loaded, then unlinked to leave nothing
# for a file scan. Deletions under /usr, /lib, /opt and /var/lib are package upgrades and
# are not reported, so this fires only for libraries that lived somewhere nothing installs to.
# Medium, not high: JVM libraries (JNA, Netty, RocksDB) unpack a native library, load it and
# delete it as a matter of course, which the snapshot cannot tell from the malicious case.
foreach: processes
when: 'item.mapped_libs_deleted != null && item.mapped_libs_deleted.size() > 0'
evidence:
  pid: item.pid
  comm: item.comm
  exe: item.exe
  libs: item.mapped_libs_deleted
dedup: ["item.exe"]
---
id: process-ld-preload-env
title: "Process started with LD_PRELOAD/LD_AUDIT pointing at a non-system library"
category: process
severity: high
score: 75
mitre: ["T1574.006"]
# Per-process injection leaves no file-level trace: nothing in ld.so.preload, no unit, no
# profile line. Only the environment of the running process shows it. Libraries under the
# distribution directories (jemalloc, libgtk3-nocsd) are not reported.
foreach: processes
when: 'item.preload_env != ""'
evidence:
  pid: item.pid
  comm: item.comm
  exe: item.exe
  env: item.preload_env
dedup: ["item.exe"]

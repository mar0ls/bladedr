<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>bladedr · change password</title>
<style>
  :root{--bg:#0b0e14;--panel:#141925;--text:#e6edf3;--muted:#8b98a9;--accent:#3b82f6;--border:#26303f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;
    display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:2rem;width:360px}
  .brand{text-align:center;margin-bottom:.3rem}
  .brand img{max-width:100%;height:auto}
  label{display:block;color:var(--muted);font-size:.85rem;margin:.9rem 0 .25rem}
  input{width:100%;padding:.6rem .7rem;background:#0b0e14;border:1px solid var(--border);border-radius:8px;color:var(--text)}
  button{width:100%;margin-top:1.2rem;padding:.65rem;background:var(--accent);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer}
  .err{color:#f87171;font-size:.85rem;margin-top:.8rem;min-height:1rem}
  .sub{color:var(--muted);font-size:.85rem;margin-top:.3rem}
  .note{background:#1c2333;border:1px solid var(--border);border-radius:8px;padding:.7rem .8rem;
    color:var(--muted);font-size:.85rem;margin-top:1rem}
</style></head>
<body>
  <form class="card" onsubmit="return change(event)">
    <div class="brand"><img src="/ui/logo.png" alt="bladedr" width="240"></div>
    <div class="sub">change password</div>
    {{if .Forced}}
    <div class="note">This password was generated for you, or reset by an administrator,
      so someone else has seen it. Choose a new one to continue.</div>
    {{end}}
    <label>Current password</label><input id="cur" type="password" autofocus autocomplete="current-password">
    <label>New password <span class="sub">(min 8 characters)</span></label>
    <input id="new" type="password" autocomplete="new-password">
    <label>Confirm new password</label><input id="new2" type="password" autocomplete="new-password">
    <button type="submit">Change password</button>
    <div class="err" id="err"></div>
  </form>
<script>
function change(e){
  e.preventDefault();
  var err=document.getElementById('err');
  var a=document.getElementById('new').value, b=document.getElementById('new2').value;
  if(a!==b){ err.textContent='New passwords do not match'; return false; }
  fetch('/api/v1/me/password',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({current_password:document.getElementById('cur').value,new_password:a})})
    .then(function(r){ if(r.ok){location.href='/ui';}
      else {return r.json().catch(function(){return {};}).then(function(x){err.textContent=x.error||'Could not change password';});} })
    .catch(function(){err.textContent='network error';});
  return false;
}
</script>
</body></html>
